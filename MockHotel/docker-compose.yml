services:
  postgres:
    container_name: mock-hotel-postgres
    image: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dev}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "55432:5432"
    volumes:
      - ./sql/database.sql:/docker-entrypoint-initdb.d/1.database.sql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/2.schema.sql
      - ./sql/test.sql:/docker-entrypoint-initdb.d/3.test.sql
      - ./sql/data.sql:/docker-entrypoint-initdb.d/4.data.sql

  web:
    build: .
    container_name: mock-hotel-web
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/dev
      SESSION_SECRET: ${SESSION_SECRET:-mock-hotel-local-secret}
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      - postgres
